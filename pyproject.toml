# AI install hint: choose deps by OS/env + needed ui/bot. do NOT install all.
# minimal core first; missing packages can be installed on demand.

[project]
name = "wlwl-ass"
version = "0.1.0"
description = "Minimalist self-evolving autonomous agent framework"
readme = "README.md"
requires-python = ">=3.10,<3.14"
license = { text = "MIT" }
dependencies = [
    "requests>=2.28",
    "beautifulsoup4>=4.12",
    "bottle>=0.12",
    "simple-websocket-server>=0.4",
]

[project.optional-dependencies]
# select extras, not all. match current task/env.
# examples: .[ui] for GUI, bot deps only if bot needed.
ui = [
    "streamlit>=1.28",
    "pywebview>=4.0",
    "PySide6>=6.7",
]
all-frontends = [
    "python-telegram-bot>=20.0",
    "qq-botpy>=1.0",
    "pycryptodome>=3.19",
    "qrcode>=7.4",
    "lark-oapi>=1.0",
    "wecom-aibot-sdk>=1.0",
    "dingtalk-stream>=0.20",
]
voice = [
    "websockets>=12.0",
    "webrtcvad>=2.0.10",
    "soundfile>=0.12",
    "pypinyin>=0.51",
]
# Local fallback STT — used when the cloud STT (xiaomi MiMo / etc.) returns
# error or is unreachable. faster-whisper bundles CTranslate2 + PyAV so no
# system ffmpeg is needed. The first transcribe() downloads the model
# (~74MB for "base", ~244MB for "small") to ~/.cache/huggingface.
stt-local = [
    "faster-whisper>=1.2",
]
# WeChat outbound IM via UI automation. Windows-only (drives the PC WeChat
# client window). Tested against WeChat 3.9.x; 4.x may require the ljqCtrl
# fallback in memory/wechat_ljqctrl_sop.md.
wechat = [
    "wxauto>=3.9",
]
test = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = []

[tool.pytest.ini_options]
addopts = "-p no:cacheprovider"
testpaths = ["tests"]
cache_dir = "temp/.pytest_cache"
norecursedirs = [".git", ".venv", ".deps", "pytest-cache-files-*", "voice-website"]
asyncio_mode = "auto"
