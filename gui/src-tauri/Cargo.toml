[package]
name = "wlwl-ass-gui"
version = "0.1.0"
description = "wlwl-ass desktop GUI shell"
authors = ["wlwl-ass contributors"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "wlwl_ass_gui_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.0", features = [] }

[dependencies]
anyhow = "1.0"
log = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rand = "0.8"
tauri = { version = "2.1", features = ["tray-icon"] }
tauri-plugin-log = "2.0"
tokio = { version = "1.41", features = ["macros", "rt-multi-thread", "sync", "time", "process"] }
which = "7.0"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
