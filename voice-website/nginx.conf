# nginx config for the wlwl-ass voice console.
#
# Single-page app: every non-asset path falls back to index.html.
# WebSocket reverse-proxy is OUT OF THIS NGINX. The website talks directly
# to the wlwl-ass server URL configured in Settings — that URL is whatever
# the operator pointed at (localhost / their own reverse proxy / VPN).

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # cache fingerprinted assets aggressively
    location ~* \.(?:js|css|woff2?|ttf|svg|png|jpg|jpeg|webp)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }

    # tighten a couple of headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # gzip the text bits
    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
